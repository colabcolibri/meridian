  <line x1="32" y1="16" x2="32" y2="48" stroke="#fafafa" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="28" r="4" fill="#3b82f6"/>
  <circle cx="32" cy="40" r="2" fill="#71717a"/>
  <!-- wordmark -->
  <text x="72" y="42" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#09090b" letter-spacing="-0.02em">Meridian</text>
