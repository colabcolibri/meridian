<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Meridian — a simple Scrum-based harness for coding with IDEs</title>
  <desc id="desc">README header for Meridian: a Scrum-based harness where you manage, agents ship story by story, and delivery state grows in SQLite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090b"/>
      <stop offset=".58" stop-color="#111113"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity=".24"/>
    </filter>
    <filter id="blueGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.23 0 0 0 0 0.51 0 0 0 0 0.96 0 0 0 .42 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" stroke="#27272a" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="640" rx="34" fill="url(#grid)" opacity=".32"/>
  <path d="M1168-70c92 86 150 188 172 306 25 134 10 264 124 404h136V0z" fill="#2563eb" opacity=".92"/>
  <path d="M1216-34c63 84 103 179 118 284 18 122 8 240 102 390h56c-99-143-91-273-111-397-17-106-59-203-125-277z" fill="#60a5fa" opacity=".5"/>
  <ellipse cx="842" cy="320" rx="352" ry="226" fill="#3b82f6" opacity=".08" filter="url(#blueGlow)"/>

  <!-- Brand -->
  <g transform="translate(82 82)">
    <g filter="url(#softShadow)">
      <rect width="118" height="118" rx="28" fill="#09090b"/>
      <rect x="13" y="13" width="92" height="92" rx="22" fill="#111113" stroke="#27272a" stroke-width="2.5"/>
      <path d="M59 22v74" stroke="#f4f4f5" stroke-width="5" stroke-linecap="round"/>
      <path d="M59 32c-20 0-32 9-32 22s12 22 32 22 32 9 32 22" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
      <circle cx="59" cy="37" r="10" fill="#3b82f6" stroke="#93c5fd" stroke-width="2.5"/>
      <circle cx="59" cy="59" r="7.5" fill="#fafafa"/>
      <circle cx="59" cy="82" r="6.4" fill="#71717a" stroke="#a1a1aa" stroke-width="1.7"/>
    </g>
    <text x="148" y="58" fill="#fafafa" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="820">Meridian</text>
    <text x="152" y="93" fill="#93c5fd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="760" letter-spacing=".08em">CURSOR · VS CODE · CLAUDE CODE</text>
  </g>

  <!-- Callout: one "harness"; wider lines use left column before the board -->
  <g transform="translate(72 258)">
    <text x="0" y="0" fill="#fafafa" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="840">
      <tspan x="0" dy="0">A simple Scrum-based harness</tspan>
      <tspan x="0" dy="54">for coding with IDEs.</tspan>
    </text>
    <text x="2" y="148" fill="#d4d4d8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="520">
      <tspan x="2" dy="0">You manage; agents ship story by story.</tspan>
      <tspan x="2" dy="38">Delivery state lives in SQLite and grows with the project.</tspan>
    </text>
  </g>

  <!-- Right card: mini board (product surface), not a second pitch -->
  <g transform="translate(820 88)" filter="url(#softShadow)">
    <rect width="680" height="464" rx="28" fill="#f8fafc" stroke="#3f3f46" stroke-width="2"/>

    <!-- chrome -->
    <rect x="20" y="20" width="640" height="52" rx="16" fill="#09090b"/>
    <circle cx="50" cy="46" r="7" fill="#22c55e"/>
    <circle cx="74" cy="46" r="7" fill="#f59e0b"/>
    <circle cx="98" cy="46" r="7" fill="#ef4444"/>
    <text x="130" y="52" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">board</text>
    <text x="620" y="52" text-anchor="end" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">v11 · EPIC-02</text>

    <!-- filters strip -->
    <g transform="translate(36 92)">
      <rect width="88" height="30" rx="15" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="44" y="20" text-anchor="middle" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Version</text>
      <rect x="100" width="72" height="30" rx="15" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="136" y="20" text-anchor="middle" fill="#52525b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Epic</text>
      <rect x="184" width="96" height="30" rx="15" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="232" y="20" text-anchor="middle" fill="#52525b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Sprint</text>
    </g>

    <!-- columns: board UI 📋 Backlog · 📌 Todo · ✅ Done (❌+ready → backlog/todo) -->
    <g transform="translate(36 140)">
      <!-- 📋 Backlog: status ❌, ready false -->
      <g>
        <text x="8" y="18" fill="#71717a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="750">📋 Backlog</text>
        <rect y="32" width="188" height="78" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
        <text x="16" y="58" fill="#18181b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">US-0104 Auth flow</text>
        <text x="16" y="82" fill="#71717a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500">ready: false</text>
        <rect y="122" width="188" height="64" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
        <text x="16" y="148" fill="#18181b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">US-0105 Billing</text>
        <text x="16" y="170" fill="#71717a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500">depends_on: US-0104</text>
      </g>

      <!-- 📌 Todo: status ❌, ready true -->
      <g transform="translate(208 0)">
        <text x="8" y="18" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="750">📌 Todo</text>
        <rect y="32" width="188" height="96" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
        <text x="16" y="58" fill="#1e3a8a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="750">US-0102 Board filters</text>
        <rect x="16" y="72" width="88" height="24" rx="8" fill="#dbeafe"/>
        <text x="60" y="88" text-anchor="middle" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="750">ready: true</text>
        <rect x="112" y="72" width="56" height="24" rx="8" fill="#ffffff" stroke="#93c5fd"/>
        <text x="140" y="88" text-anchor="middle" fill="#2563eb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Must</text>
      </g>

      <!-- ✅ Done -->
      <g transform="translate(416 0)">
        <text x="8" y="18" fill="#15803d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="750">✅ Done</text>
        <rect y="32" width="188" height="96" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <text x="16" y="58" fill="#14532d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="750">US-0101 Init harness</text>
        <rect x="16" y="72" width="100" height="24" rx="8" fill="#dcfce7"/>
        <text x="66" y="88" text-anchor="middle" fill="#15803d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="750">## Record</text>
      </g>
    </g>

    <!-- footer: slash loop + implement gate -->
    <g transform="translate(36 372)">
      <rect width="608" height="56" rx="16" fill="#09090b"/>
      <text x="24" y="34" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">/refine-us</text>
      <text x="128" y="34" fill="#3b82f6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">→</text>
      <text x="152" y="34" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">/implement-us</text>
      <text x="302" y="34" fill="#3b82f6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">→</text>
      <text x="326" y="34" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">/complete-us</text>
      <text x="584" y="34" text-anchor="end" fill="#71717a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">gate: ready: true</text>
    </g>
  </g>
</svg>
