      <rect width="118" height="118" rx="28" fill="#09090b"/>
      <rect x="13" y="13" width="92" height="92" rx="22" fill="#111113" stroke="#27272a" stroke-width="2.5"/>
      <path d="M59 22v74" stroke="#f4f4f5" stroke-width="5" stroke-linecap="round"/>
      <path d="M59 32c-20 0-32 9-32 22s12 22 32 22 32 9 32 22" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
