    <text x="148" y="58" fill="#fafafa" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="820" letter-spacing="0">Meridian</text>
    <text x="152" y="93" fill="#93c5fd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="760" letter-spacing=".12em">AI-ASSISTED DELIVERY INFRASTRUCTURE</text>
  </g>

  <g transform="translate(84 250)">
    <text x="0" y="0" fill="#fafafa" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="840" letter-spacing="0">
      <tspan x="0" dy="0">Not another chatbot.</tspan>
      <tspan x="0" dy="70">A system for agents.</tspan>
    </text>
    <text x="2" y="170" fill="#d4d4d8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="520">
      <tspan x="2" dy="0">Scrum-shaped delivery, project memory,</tspan>
      <tspan x="2" dy="38">agent roles, workflows, and SQLite-backed state.</tspan>
    </text>
  </g>

