        <text x="29" y="22" text-anchor="middle" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">roles</text>
        <rect x="70" width="78" height="32" rx="9" fill="#ffffff" stroke="#93c5fd"/>
        <text x="109" y="22" text-anchor="middle" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">workflow</text>
