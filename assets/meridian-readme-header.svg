      <text x="92" y="40" text-anchor="middle" fill="#18181b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800">Agents</text>
      <g fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.5">
        <rect x="20" y="64" width="58" height="44" rx="12"/>
        <rect x="90" y="64" width="58" height="44" rx="12"/>
        <rect x="20" y="124" width="58" height="44" rx="12"/>
        <rect x="90" y="124" width="58" height="44" rx="12"/>
