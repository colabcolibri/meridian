        <path d="M40 16v48" stroke="#f4f4f5" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M40 22c-13 0-21 6-21 14s8 14 21 14 21 6 21 14" stroke="#3b82f6" stroke-width="3.2" stroke-linecap="round"/>
