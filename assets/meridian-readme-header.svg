      <text x="49" y="91" text-anchor="middle" fill="#2563eb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="850">Product</text>
      <text x="119" y="91" text-anchor="middle" fill="#2563eb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="850">Arch</text>
      <text x="49" y="151" text-anchor="middle" fill="#2563eb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="850">Dev</text>
      <text x="119" y="151" text-anchor="middle" fill="#2563eb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="850">QA</text>
      <rect x="34" y="188" width="100" height="28" rx="14" fill="#dcfce7" stroke="#22c55e"/>
      <text x="84" y="207" text-anchor="middle" fill="#15803d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="850">with context</text>
    </g>

    <g transform="translate(46 374)">
      <rect width="568" height="70" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="32" y="43" fill="#18181b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="850">Discover</text>
      <path d="M124 35h38" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
