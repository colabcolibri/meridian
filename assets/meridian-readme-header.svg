      <path d="M236 35h38" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="296" y="43" fill="#18181b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="850">Build</text>
      <path d="M354 35h38" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="414" y="43" fill="#18181b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="850">Review</text>
      <path d="M492 35h38" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="526" y="43" fill="#15803d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="850">Ship</text>
