name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-meridian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap delivery SQLite
        run: python3 .agent/scripts/meridian_delivery.py bootstrap

      - name: Validar estrutura Meridian
        run: python3 .agent/scripts/validate_meridian.py . --sqlite-only --strict-kit-md

      - name: Sync IDE adapters
        run: bash .agent/scripts/sync_kit.sh

      - name: Validate kit parity
        run: python3 .agent/scripts/validate_kit_parity.py . --strict

      - name: Kit Python test suite
        run: python3 .agent/scripts/run_kit_tests.py

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-visual-studio
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app-visual-studio/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm compile

      - name: Testes
        run: pnpm test

      - name: Coverage (advisory)
        run: pnpm test:coverage
        continue-on-error: true
