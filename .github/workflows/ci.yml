name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-meridian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar estrutura Meridian
        run: python3 .agent/scripts/validate_meridian.py . --sqlite-only

      - name: Schema SQLite smoke test
        run: python3 .agent/scripts/test_meridian_db_schema.py

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-visual-studio
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app-visual-studio/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes
        run: pnpm test
