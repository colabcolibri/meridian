# Public demo: app-desktop in VITE_DEMO_MODE (bundled app-desktop/docs).
# After the first successful run, enable Settings → Pages → Source: GitHub Actions.
# URL: https://colabcolibri.github.io/meridian/

name: Deploy demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "app-desktop/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app-desktop/pnpm-lock.yaml

      - name: Build demo for GitHub Pages
        working-directory: app-desktop
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          pnpm install --frozen-lockfile
          pnpm sync:demo-docs
          pnpm exec tsc -b
          pnpm exec vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-desktop/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
