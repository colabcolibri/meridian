name: PR review checklist

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post independent review reminder
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Meridian review gate

            This PR should pass **automated CI** before human merge. For agent-generated changes:

            - [ ] CI green (typecheck, lint, tests, kit tests, audit)
            - [ ] **Independent review** — reviewer agent or human who did **not** implement the diff
            - [ ] Spec/architecture changes: human approval on phase docs or US acceptance
            - [ ] Security-sensitive paths: run \`/security-review\` when touching \`.agent/scripts/lib/\` or auth

            See \`.agent/references/protocol/agentic-trust-policy.md\` for earned-trust tiers.
            `;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## Meridian review gate';
            if (comments.some((c) => c.body?.includes(marker))) {
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
